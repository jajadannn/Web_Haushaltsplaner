[project]
name = "finanzplaner"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "mt-940>=5.1.3",
    "ofxparse>=0.21",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "regex>=2026.9.29",
    "reportlab>=5.1.0",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
    "watchdog>=7.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # ofxparse nutzt noch die alte BeautifulSoup-API
    "ignore:Call to deprecated method findAll:DeprecationWarning:ofxparse",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [".pg", ".tools", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Testfälle mit ausgeschriebenen Daten dürfen länger sein
"tests/**" = ["E501"]
