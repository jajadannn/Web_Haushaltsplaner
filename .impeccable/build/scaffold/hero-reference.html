<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: wand-c.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Hepta+Slab:wght@700&family=Delius+Unicase:wght@700&family=Ysabeau+SC:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#172323}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-month-title region text" data-region="month-title"><!-- Monatsname, Kopfzeile --><p style="font-size:var(--r-month-title-font);font-family:var(--r-month-title-family),sans-serif;font-weight:var(--r-month-title-weight);line-height:1.05;margin:0">month-title</p></div>
  <div class="r-status-line region text" data-region="status-line"><!-- Stand-Zeitstempel und verbleibende Tage --><p style="font-size:var(--r-status-line-font);line-height:1.05;margin:0">status-line</p></div>
  <div class="r-profile-tile region chrome" data-region="profile-tile"><!-- Spielraum-Kachel je Person, abgerundet #1f2328 --></div>
  <div class="r-profile-tile-2 region chrome" data-region="profile-tile-2"><!-- zweite Spielraum-Kachel (gleiche Komponente) --></div>
  <div class="r-available-amount-2 region text" data-region="available-amount-2"><!-- Spielraum zweite Person --><p style="font-size:var(--r-available-amount-2-font);font-family:var(--r-available-amount-2-family),sans-serif;font-weight:var(--r-available-amount-2-weight);line-height:1.05;margin:0">available-amount-2</p></div>
  <div class="r-profile-name region text" data-region="profile-name"><!-- Profilname, Versalien --><p style="font-size:var(--r-profile-name-font);line-height:1.05;margin:0">profile-name</p></div>
  <div class="r-available-label region text" data-region="available-label"><!-- Frei verfügbar, gedämpft --><p style="font-size:var(--r-available-label-font);line-height:1.05;margin:0">available-label</p></div>
  <div class="r-available-amount region text" data-region="available-amount"><!-- größte Zahl im Raum, Tabellenziffern --><p style="font-size:var(--r-available-amount-font);font-family:var(--r-available-amount-family),sans-serif;font-weight:var(--r-available-amount-weight);line-height:1.05;margin:0">available-amount</p></div>
  <div class="r-per-day region text" data-region="per-day"><!-- Betrag pro Tag, gedämpft --><p style="font-size:var(--r-per-day-font);line-height:1.05;margin:0">per-day</p></div>
  <div class="r-loan-tile region chrome" data-region="loan-tile"><!-- Kreditkachel --></div>
  <div class="r-loan-name region text" data-region="loan-name"><!-- Kreditname --><p style="font-size:var(--r-loan-name-font);font-family:var(--r-loan-name-family),sans-serif;font-weight:var(--r-loan-name-weight);line-height:1.05;margin:0">loan-name</p></div>
  <div class="r-loan-debt region text" data-region="loan-debt"><!-- Restschuld --><p style="font-size:var(--r-loan-debt-font);line-height:1.05;margin:0">loan-debt</p></div>
  <div class="r-loan-payoff region text" data-region="loan-payoff"><!-- Abbezahlt-Datum, Restraten --><p style="font-size:var(--r-loan-payoff-font);line-height:1.05;margin:0">loan-payoff</p></div>
  <div class="r-timeline-panel region chrome" data-region="timeline-panel"><!-- große Kachel mit Zeitleisten je Person --></div>
  <div class="r-timeline-name region text" data-region="timeline-name"><!-- Profilname über der Zeitleiste --><p style="font-size:var(--r-timeline-name-font);line-height:1.05;margin:0">timeline-name</p></div>
  <div class="r-today-marker region chrome" data-region="today-marker"><!-- weiße Heute-Linie mit Beschriftung --></div>
  <div class="r-event-card region chrome" data-region="event-card"><!-- Fälligkeitskarte mit Status-Icon, Pin zur Achse --></div>
  <div class="r-event-text region text" data-region="event-text"><!-- Name Betrag fett, Tag und Status gedämpft --><p style="line-height:1.05;margin:0">event-text</p></div>
  <div class="r-day-axis region chrome" data-region="day-axis"><!-- Tagesachse 1–30 mit Ticks und Punkten --></div>
</main>
</body>
</html>
